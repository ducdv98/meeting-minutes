[package]
name = "meeting-minutes"
version = "1.2.0"
edition = "2021"
build = "build.rs"

[dependencies]
meeting_minutes_core = { path = "../crates/core" }
meeting_minutes_whisper = { path = "../crates/whisper" }
tauri = { version = "=2.12.3", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-global-shortcut = "=2.4.1"
chrono = "0.4"
tauri-plugin-dialog = "=2.8.2"
tauri-plugin-log = "=2.8.0"
tauri-plugin-notification = "=2.6.0"
tauri-plugin-updater = "=2.13.3"
sysinfo = "=0.37.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time"] }
tauri-plugin-window-state = "=2.5.0"

[build-dependencies]
tauri-build = "=2.7.2"

[target.'cfg(windows)'.dependencies]
keyring = { version = "=3.6.3", features = ["windows-native"] }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"] }
