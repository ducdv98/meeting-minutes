[package]
name = "meeting_minutes_core"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = "1"
log = "0.4"
flacenc = { version = "0.5", default-features = false }
base64 = "0.22"
mp3lame-encoder = "0.2"
claxon = "0.4"
sha2 = "0.10"
ureq = { version = "2", default-features = false, features = ["tls"] }
symphonia = { version = "0.6.1", default-features = false, features = ["mp3", "aac", "isomp4", "wav", "pcm", "flac"] }
uuid = { version = "1", features = ["v4"] }
unicode-normalization = "0.1"

[target.'cfg(windows)'.dependencies]
wasapi = "0.26"
windows = { version = "0.62", features = ["Win32_System_Performance", "Win32_System_Power", "Win32_UI_Shell", "Win32_Foundation"] }

[dev-dependencies]
tempfile = "3"
minimp3 = "0.5"
