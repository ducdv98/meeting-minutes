[package]
name = "meeting_minutes_core"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = "1"
flacenc = { version = "0.5", default-features = false }
mp3lame-encoder = "0.2"
claxon = "0.4"

[target.'cfg(windows)'.dependencies]
wasapi = "0.26"
windows = { version = "0.62", features = ["Win32_System_Performance"] }

[dev-dependencies]
tempfile = "3"
minimp3 = "0.5"
