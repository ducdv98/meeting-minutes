name: Release draft

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  draft:
    runs-on: windows-2022
    env:
      # whisper.cpp's Vulkan shader generator builds under MSBuild, whose file tracker
      # fails on paths over 260 characters; a short target dir keeps them under it.
      CARGO_TARGET_DIR: 'D:\t'
      RELEASE_TAG: ${{ github.ref_name }}
      GGML_NATIVE: "OFF"
      GGML_AVX: "ON"
      GGML_AVX2: "ON"
      GGML_FMA: "ON"
      GGML_F16C: "ON"
      GGML_BMI2: "ON"
      GGML_AVX512: "OFF"
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1.7.0
        with:
          vulkan_version: 1.4.309.0
          install_runtime: true
      - name: Copy Vulkan loader for installer
        shell: pwsh
        run: ./scripts/copy-vulkan-loader.ps1
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      - name: Check tag and app versions
        run: node scripts/check-release-version.mjs
      - name: Check release notes
        shell: pwsh
        run: |
          $notes = "RELEASE_NOTES/$env:RELEASE_TAG.md"
          if (-not (Test-Path -LiteralPath $notes -PathType Leaf)) { throw "Missing release notes file: $notes" }
          if ([string]::IsNullOrWhiteSpace((Get-Content -LiteralPath $notes -Raw))) { throw "Release notes file is empty: $notes" }
      - name: Refuse to change a published Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if release_draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>&1); then
            if [ "$release_draft" != true ]; then
              echo "Release $RELEASE_TAG is already published" >&2
              exit 1
            fi
          elif [[ "${release_draft,,}" != *"release not found"* ]]; then
            echo "$release_draft" >&2
            exit 1
          fi
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: node --test scripts/check-release-version.node.mjs
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: cargo test --workspace
      - name: Verify pinned whisper.cpp CPU flags
        run: cargo test -p meeting_minutes_whisper pinned_cpu_instruction_set -- --ignored --nocapture
      - uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Meeting Minutes ${{ github.ref_name }}
          releaseDraft: true
          includeUpdaterJson: true
          args: --bundles nsis --config src-tauri/tauri.release.conf.json --config src-tauri/tauri.vulkan.conf.json
      - name: Set draft Release notes
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          $notesFile = "RELEASE_NOTES/$env:RELEASE_TAG.md"
          if (-not (Test-Path -LiteralPath $notesFile -PathType Leaf)) {
            throw "Missing Release notes file: $notesFile"
          }
          gh release edit $env:RELEASE_TAG --notes-file $notesFile
          if ($LASTEXITCODE -ne 0) { throw "Could not set draft Release notes from $notesFile" }
      - name: Locate NSIS installer
        id: installer
        shell: pwsh
        run: |
          $directory = Join-Path $env:CARGO_TARGET_DIR 'release/bundle/nsis'
          $installers = @(Get-ChildItem -LiteralPath $directory -Filter '*.exe' -File)
          if ($installers.Count -ne 1) { throw "Expected one NSIS installer, found $($installers.Count)" }
          "path=$($installers[0].FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Attest installer build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ steps.installer.outputs.path }}
      - name: Upload checksum and add verification links to draft notes
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          INSTALLER_PATH: ${{ steps.installer.outputs.path }}
        run: |
          $installer = Get-Item -LiteralPath $env:INSTALLER_PATH
          $hash = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksum = "$($installer.FullName).sha256"
          "$hash  $($installer.Name.Replace(' ', '.'))" | Set-Content -LiteralPath $checksum -Encoding utf8
          gh release upload $env:RELEASE_TAG $checksum --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload installer checksum' }

          $body = (Get-Content -LiteralPath "RELEASE_NOTES/$env:RELEASE_TAG.md" -Raw).TrimEnd()
          $verification = @(
            '<!-- installer-verification -->'
            '## Verify the installer'
            "SHA-256: $hash"
            "[Download checksum](https://github.com/$env:GH_REPO/releases/download/$env:RELEASE_TAG/$($installer.Name).sha256)"
            "[VirusTotal scan](https://www.virustotal.com/gui/file/$hash) (results appear after the file is scanned)."
            'Verify the build provenance with `gh attestation verify <installer> --repo <owner>/<repo>`.'
            '<!-- /installer-verification -->'
          ) -join [Environment]::NewLine
          $notes = @($body, $verification) -join ([Environment]::NewLine + [Environment]::NewLine)
          $notesFile = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          $notes | Set-Content -LiteralPath $notesFile -Encoding utf8
          gh release edit $env:RELEASE_TAG --notes-file $notesFile
          if ($LASTEXITCODE -ne 0) { throw 'Could not update draft release notes' }
