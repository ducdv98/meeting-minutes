name: CI

on: [push, pull_request]

jobs:
  linux-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Windows can't tell apart paths that differ only in case. Extensions are stripped because
      # imports omit them: "./Player" resolved to player.ts instead of Player.tsx.
      - name: Check for case-only path collisions
        run: |
          collisions=$(git ls-files | sed -E 's/\.(d\.ts|[cm]?[jt]sx?)$//' | sort -u | sort -f | uniq -di)
          if [ -n "$collisions" ]; then echo "Paths differing only in case:"; echo "$collisions"; exit 1; fi
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      - run: cargo test -p meeting_minutes_core
      - run: cargo test -p capture-spike
      - run: node --test scripts/check-release-version.node.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      # Tauri's generate_context! needs the built frontend in dist/.
      - run: pnpm build
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  windows:
    runs-on: windows-2022
    env:
      # whisper.cpp's Vulkan shader generator builds under MSBuild, whose file tracker
      # fails on paths over 260 characters; a short target dir keeps them under it.
      CARGO_TARGET_DIR: 'D:\t'
      GGML_NATIVE: "OFF"
      GGML_AVX: "ON"
      GGML_AVX2: "ON"
      GGML_FMA: "ON"
      GGML_F16C: "ON"
      GGML_BMI2: "ON"
      GGML_AVX512: "OFF"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1.7.0
        with:
          vulkan_version: 1.4.309.0
          install_runtime: true
      - name: Copy Vulkan loader for installer
        shell: pwsh
        run: ./scripts/copy-vulkan-loader.ps1
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      # Tauri's generate_context! needs the built frontend in dist/.
      - run: pnpm build
      - run: cargo test --workspace
      - name: Verify pinned whisper.cpp CPU flags
        run: cargo test -p meeting_minutes_whisper pinned_cpu_instruction_set -- --ignored --nocapture
      - run: pnpm tauri build --bundles nsis --config src-tauri/tauri.vulkan.conf.json
      - run: cargo build --release -p capture-spike
      - uses: actions/upload-artifact@v4
        with:
          name: capture-spike-windows
          path: D:/t/release/capture-spike.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: meeting-minutes-windows-installer
          path: D:/t/release/bundle/nsis/*.exe
          if-no-files-found: error
