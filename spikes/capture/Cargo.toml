[package]
name = "capture-spike"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
ctrlc = "3"
hound = "3"
wasapi = "0.26"
windows = { version = "0.62", features = ["Win32_System_Performance"] }
