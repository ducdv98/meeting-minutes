[package]
name = "ct2-spike"
version = "0.1.0"
edition = "2021"

[workspace]

[dependencies]
ct2rs = { version = "=0.10.2", default-features = false, features = ["whisper", "ruy"] }
meeting_minutes_core = { path = "../../crates/core" }
meeting_minutes_whisper = { path = "../../crates/whisper" }
sysinfo = "=0.37.2"
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
